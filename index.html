<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光环民宿 | Aura Apartment</title>
    
    <!-- 强制浏览器预下载5张顶级大图，确保零闪烁秒开 -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1585123334904-8452a641a47b?auto=format&fit=crop&w=1920&q=80">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1541410965313-d53b3c16ef17?auto=format&fit=crop&w=1920&q=80">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1507501336603-6e31db2be093?auto=format&fit=crop&w=1920&q=80">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1621213442111-e1291b5825ac?auto=format&fit=crop&w=1920&q=80">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1579705745811-a32bef7856a3?auto=format&fit=crop&w=1920&q=80">
    
    <style>
        /* 基础设置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #1a1a1a; 
        }

        /* 绝对无瑕疵的图层叠加轮播系统 */
        .slideshow {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: crossFade 30s infinite;
        }

        /* 5张约旦风情图库 & 精确的时间差拨片 */
        .slide-1 { background-image: url('https://images.unsplash.com/photo-1585123334904-8452a641a47b?auto=format&fit=crop&w=1920&q=80'); animation-delay: 0s; }
        .slide-2 { background-image: url('https://images.unsplash.com/photo-1541410965313-d53b3c16ef17?auto=format&fit=crop&w=1920&q=80'); animation-delay: 6s; }
        .slide-3 { background-image: url('https://images.unsplash.com/photo-1507501336603-6e31db2be093?auto=format&fit=crop&w=1920&q=80'); animation-delay: 12s; }
        .slide-4 { background-image: url('https://images.unsplash.com/photo-1621213442111-e1291b5825ac?auto=format&fit=crop&w=1920&q=80'); animation-delay: 18s; }
        .slide-5 { background-image: url('https://images.unsplash.com/photo-1579705745811-a32bef7856a3?auto=format&fit=crop&w=1920&q=80'); animation-delay: 24s; }

        @keyframes crossFade {
            0%   { opacity: 0; }
            6%   { opacity: 1; }
            20%  { opacity: 1; }
            26%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* 黑色半透明遮罩 */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* 内容居中排版 */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 高级毛玻璃面板 & 悬浮动画 */
        .slogan-box {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 80px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .cn-slogan {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .en-slogan {
            font-size: 1.4rem;
            color: #e0e0e0;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* ================= 新版底部模块：绝对居中对齐 ================= */
        .footer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            flex-direction: column; /* 垂直排列 */
            align-items: center;    /* 强制居中 */
            gap: 15px;              /* 各元素之间的固定间距 */
            z-index: 2;
        }

        /* 1. 邮箱样式 */
        .contact-email {
            color: #ffffff;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            opacity: 0.8;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* 2. 图集按钮样式 */
        .gallery-btn {
            display: inline-block;
            padding: 10px 30px;
            border: 1px solid #f8ca55;
            color: #f8ca55;
            text-decoration: none;
            border-radius: 30px;
            letter-spacing: 2px;
            transition: 0.3s;
            background: rgba(0,0,0,0.4);
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .gallery-btn:hover {
            background: rgba(248,202,85,0.2);
            transform: translateY(-2px);
        }

        /* 3. 三语品牌标语样式 */
        .multi-lang-slogan {
            text-align: center;
            color: #f8ca55; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            line-height: 1.5;
            margin-top: 5px;
        }
        .lang-cn { font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; }
        .lang-en { font-size: 0.85rem; letter-spacing: 1px; opacity: 0.9; }
        /* dir="rtl" 确保阿拉伯语的标点符号位置绝对正确 */
        .lang-ar { font-size: 0.95rem; opacity: 0.9; font-family: Arial, sans-serif; margin-top: 2px;}

        /* 手机端屏幕完美适配 */
        @media (max-width: 768px) {
            .slogan-box { padding: 40px 25px; }
            .cn-slogan { font-size: 2.2rem; }
            .en-slogan { font-size: 1.1rem; }
            
            .footer { bottom: 15px; gap: 12px; }
            .contact-email { font-size: 0.85rem; }
            .gallery-btn { padding: 8px 25px; font-size: 0.8rem; }
            .lang-cn { font-size: 0.95rem; }
            .lang-en { font-size: 0.75rem; }
            .lang-ar { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <!-- 5层图片叠加无缝轮播 -->
    <div class="slideshow">
        <div class="slide slide-1"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
        <div class="slide slide-4"></div>
        <div class="slide slide-5"></div>
    </div>
    
    <!-- 压暗遮罩 -->
    <div class="overlay"></div>

    <!-- 核心文字区 -->
    <div class="content">
        <div class="slogan-box">
            <div class="cn-slogan">生活在约旦，自带光环。</div>
            <div class="en-slogan">Living in Jordan, with an Aura.</div>
        </div>
    </div>

    <!-- 全新底部结构 -->
    <div class="footer">
        <!-- 邮箱 -->
        <div class="contact-email">168support@168aura.com</div>
        
        <!-- 图库入口按钮 -->
        <a href="gallery.html" class="gallery-btn">探索 168 AURA GALLERY</a>
        
        <!-- 底部三语言品牌标示 -->
        <div class="multi-lang-slogan">
            <div class="lang-cn">168光环民宿，约旦首选。</div>
            <div class="lang-en">168 Aura Apartment, Your Premier Choice in Jordan.</div>
            <div class="lang-ar" dir="rtl">شقق أورا 168، خيارك الأول في الأردن.</div>
        </div>
    </div>

</body>
</html>
