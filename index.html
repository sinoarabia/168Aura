<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光环公寓 | Aura Apartment</title>
    
    <!-- 优化 2：预加载第一张图，优先请求图片资源 -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1585123334904-8452a641a47b?auto=format&fit=crop&w=1920&q=80">
    
    <style>
        /* 基础设置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* 防止出现滚动条 */
        }

        /* 动态背景图拼接与轮播 */
        .bg-slider {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #2a3439; /* 优化 1：高级深蓝灰底色，防止网络慢时出现浅灰色 */
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            /* 24秒一轮的背景渐变动画 */
            animation: bg-change 24s infinite alternate;
        }

        /* 预设的高清图，等你拍了实景图，把下面的 url() 里换成 './你的图片名.jpg' 即可 */
        @keyframes bg-change {
            0% { background-image: url('https://images.unsplash.com/photo-1585123334904-8452a641a47b?auto=format&fit=crop&w=1920&q=80'); }
            50% { background-image: url('https://images.unsplash.com/photo-1541410965313-d53b3c16ef17?auto=format&fit=crop&w=1920&q=80'); }
            100% { background-image: url('https://images.unsplash.com/photo-1507501336603-6e31db2be093?auto=format&fit=crop&w=1920&q=80'); }
        }

        /* 黑色半透明遮罩，保证文字在复杂背景下依然清晰可读 */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* 内容居中排版 */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 高级毛玻璃面板 & 悬浮跳动动画 */
        .slogan-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 80px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            /* 悬浮动画：4秒一个周期，平滑起伏 */
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* 中英文排版 */
        .cn-slogan {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .en-slogan {
            font-size: 1.5rem;
            color: #e0e0e0;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* 底部联系方式 */
        .footer {
            position: absolute;
            bottom: 30px;
            color: #ffffff;
            font-size: 1rem;
            letter-spacing: 1.5px;
            opacity: 0.85;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* 移动端屏幕适配 */
        @media (max-width: 768px) {
            .slogan-box { padding: 40px 30px; }
            .cn-slogan { font-size: 2.2rem; }
            .en-slogan { font-size: 1.1rem; }
            .footer { font-size: 0.8rem; bottom: 20px; }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-slider"></div>
    <div class="overlay"></div>

    <!-- 核心文字区 -->
    <div class="content">
        <div class="slogan-box">
            <div class="cn-slogan">生活在约旦，自带光环。</div>
            <div class="en-slogan">Living in Jordan, with an Aura.</div>
        </div>
        
        <!-- 页脚联系方式 -->
        <div class="footer">
            Aura Apartment | WhatsApp: +962 7711 28288 | 168support@168aura.com
        </div>
    </div>
</body>
</html>
