<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>168 Aura Gallery | 光环民宿图集</title>
    
    <style>
        /* 基础暗色主题，与首页保持一致 */
        body { 
            margin: 0; 
            padding: 0; 
            background: #0f1419; 
            color: #fff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        }

        /* 顶部导航毛玻璃效果 */
        .header { 
            text-align: center; 
            padding: 30px 20px; 
            background: rgba(15, 20, 25, 0.85); 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .header h1 { 
            margin: 0; 
            color: #f8ca55; 
            letter-spacing: 3px; 
            font-size: 1.8rem;
        }
        
        .back-btn { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 8px 25px; 
            border: 1px solid #f8ca55; 
            color: #f8ca55; 
            text-decoration: none; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        
        .back-btn:hover { 
            background: rgba(248,202,85,0.2); 
            transform: translateY(-2px);
        }
        
        /* 响应式网格布局 */
        .gallery-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 15px; 
            padding: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        .gallery-item { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            background: #2c3e50; /* 加载前的占位底色 */
        }
        
        .gallery-item:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); 
            z-index: 1;
        }

        /* 沉浸式大图查看器 (Lightbox) */
        .lightbox { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 999; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
        }
        
        .lightbox.active { 
            display: flex; 
            opacity: 1; 
        }
        
        .lightbox img { 
            max-width: 90vw; 
            max-height: 85vh; 
            border-radius: 8px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            object-fit: contain;
        }
        
        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 30px; 
            color: #ccc; 
            font-size: 45px; 
            cursor: pointer; 
            font-weight: 300; 
            transition: color 0.3s;
        }
        .close-btn:hover { color: #f8ca55; }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #ccc; 
            font-size: 50px; 
            cursor: pointer; 
            user-select: none; 
            padding: 20px; 
            transition: color 0.3s;
        }
        .nav-btn:hover { color: #f8ca55; }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .gallery-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px; }
            .header h1 { font-size: 1.4rem; }
            .nav-btn { font-size: 35px; padding: 10px; }
            .prev-btn { left: 5px; }
            .next-btn { right: 5px; }
            .close-btn { top: 10px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>168 AURA GALLERY</h1>
        <a href="index.html" class="back-btn">返回首页 / Back to Home</a>
    </div>

    <!-- 动态注入图片的容器 -->
    <div class="gallery-container" id="gallery"></div>

    <!-- 大图查看器组件 -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</span>
        <img id="lightbox-img" src="" alt="Aura Gallery Zoom">
        <span class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script>
        // 核心参数：总共 168 张图
        const totalImages = 168;
        const gallery = document.getElementById('gallery');
        let currentLightboxIndex = 1;

        // 动态加载逻辑
        for (let i = 1; i <= totalImages; i++) {
            const img = document.createElement('img');
            img.src = `images/${i}.jpg`;
            
            // 核心性能优化：原生懒加载。浏览器只加载可视区域的图片，滚动时按需加载
            img.loading = 'lazy'; 
            
            img.alt = `Aura Apartment - Image ${i}`;
            img.className = 'gallery-item';
            
            // 点击绑定放大事件
            img.onclick = () => openLightbox(i);
            
            // 容错处理：如果 168 张图中某几张不小心漏传了，隐藏该空位，避免出现破损图标
            img.onerror = function() {
                this.style.display = 'none';
            };
            
            gallery.appendChild(img);
        }

        // 大图查看器交互逻辑
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(index) {
            currentLightboxIndex = index;
            lightboxImg.src = `images/${currentLightboxIndex}.jpg`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // 打开时禁止底层页面滚动
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto'; // 关闭后恢复页面滚动
        }

        function changeImage(direction) {
            currentLightboxIndex += direction;
            // 循环切换逻辑
            if (currentLightboxIndex > totalImages) currentLightboxIndex = 1;
            if (currentLightboxIndex < 1) currentLightboxIndex = totalImages;
            
            // 每次切换时加入一点微小动画过渡
            lightboxImg.style.opacity = '0.5';
            setTimeout(() => {
                lightboxImg.src = `images/${currentLightboxIndex}.jpg`;
                lightboxImg.style.opacity = '1';
            }, 100);
        }

        // 点击背景黑底也可关闭查看器
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // 支持键盘左右键切换图片
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
